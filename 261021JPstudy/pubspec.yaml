name: jpstudy
description: 한국인을 위한 한자 연결 학습 · 한자 잇다
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6
  flutter_tts: ^4.2.5
  file_picker: ^13.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/fonts/OFL-NotoSansJP.txt
    - assets/fonts/OFL-NotoSansKR.txt
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR.ttf
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP.ttf
