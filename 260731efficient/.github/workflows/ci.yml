name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.85.0, stable]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal
      - name: Test
        run: cargo +"${{ matrix.toolchain }}" test --locked --all-targets -- --test-threads=1
      - name: Check library and product binary
        run: cargo +"${{ matrix.toolchain }}" check --locked --lib --bin idlepilot

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install stable Rust with quality tools
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Formatting
        run: cargo +stable fmt --check
      - name: Clippy
        run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --no-deps
      - name: Confirm zero third-party Cargo dependencies
        run: |
          dependency_tree=$(cargo +stable tree --locked --edges all --target all --prefix none)
          test "$(printf '%s\n' "$dependency_tree" | wc -l)" -eq 1
      - name: Verify no project license grant and preserve third-party boundaries
        run: ./scripts/verify-licensing.sh
      - name: Verify systemd user unit
        run: ./scripts/verify-systemd.sh
      - name: Verify package
        run: cargo +stable package --locked
      - name: Build, smoke-test, and reproduce release archive
        env:
          SOURCE_DATE_EPOCH: 0
        run: ./scripts/check-reproducible-dist.sh

  cross-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --target aarch64-unknown-linux-gnu
      - name: Check aarch64 library and product binary
        run: cargo +stable check --locked --target aarch64-unknown-linux-gnu --lib --bin idlepilot
