[package]
name = "idlepilot"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["idlepilot contributors"]
description = "Fail-closed, condition-gated process supervision for Linux"
readme = "README.md"
keywords = ["linux", "scheduler", "idle", "supervisor", "automation"]
categories = ["command-line-utilities", "os::linux-apis"]
exclude = ["/dist/"]

[lib]
name = "idlepilot"
path = "src/lib.rs"

[[bin]]
name = "idlepilot"
path = "src/bin/idlepilot.rs"

[dependencies]

[dev-dependencies]

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
many_single_char_names = "allow"
missing_errors_doc = "allow"
similar_names = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
