name: JPstudy Flutter checks
on:
  push:
    paths:
      - '261021JPstudy/**'
      - '!261021JPstudy/README.md'
      - '!261021JPstudy/docs/testing.md'
      - '!261021JPstudy/docs/screenshots/**'
      - '.github/workflows/jpstudy.yml'
  pull_request:
    paths:
      - '261021JPstudy/**'
      - '!261021JPstudy/README.md'
      - '!261021JPstudy/docs/testing.md'
      - '!261021JPstudy/docs/screenshots/**'
      - '.github/workflows/jpstudy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jpstudy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 261021JPstudy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: python3 tool/build_curriculum.py --check
      - run: python3 tool/validate_curriculum.py
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test --concurrency=1
      - name: Create temporary CI signing key
        shell: bash
        run: |
          signing_dir="$RUNNER_TEMP/jpstudy-signing"
          mkdir -p "$signing_dir"
          keytool -genkeypair -keystore "$signing_dir/ci.jks" \
            -storepass ci-validation-only -keypass ci-validation-only \
            -alias jpstudy-ci -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=JPstudy CI" -noprompt
          printf 'storeFile=%s\nstorePassword=ci-validation-only\nkeyAlias=jpstudy-ci\nkeyPassword=ci-validation-only\n' \
            "$signing_dir/ci.jks" > "$signing_dir/release.properties"
          echo "JPSTUDY_SIGNING_PROPERTIES=$signing_dir/release.properties" >> "$GITHUB_ENV"
      - name: Build minified release and check Kotlin JNI bridge
        run: |
          flutter build apk --release
          python3 tool/verify_release_jni.py
      - uses: actions/upload-artifact@v4
        with:
          name: jpstudy-ci-release-apk
          path: |
            261021JPstudy/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/jpstudy-signing"
